<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link href="https://fonts.googleapis.com/css?family=Montserrat:100,300,400,500,600,700,800,900&display=swap"
        rel="stylesheet">
    <title>Animated Search Input Button</title>
</head>
<body>
    <span class="title">
        Search<span class="blink">.</span>
    </span>
    <div class="input-container">
        <input class="custom-input" placeholder="Search">
        <div class="icon-container">
            <i class="avatar material-icons">search</i>
        </div>
    </div>
    
    <script src="frontendfocus.js"></script>
</body>
</html>
