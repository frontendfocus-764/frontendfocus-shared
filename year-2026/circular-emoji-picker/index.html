<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">
    <title>Circular Emoji Picker Animation</title>
</head>
<body>
   <main id="app">
    <select class="select-2" tabindex="0" aria-label="Select animal" autofocus>
        <option data-emoji="🦁"></option>
        <option data-emoji="🐯"></option>
        <option data-emoji="🐻"></option>
        <option data-emoji="🐼"></option>
        <option data-emoji="🐨"></option>
        <option data-emoji="🦊"></option>
        <option data-emoji="🐺" selected></option>
        <option data-emoji="🦝"></option>
        <option data-emoji="🐸"></option>
        <option data-emoji="🐵"></option>
        <option data-emoji="🦄"></option>
        <option data-emoji="🐙"></option>
        <option data-emoji="🦉"></option>
    </select>
</main>
    <script src="frontendfocus.js"></script>
</body>
</html>
