<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <title>Cold Brew Coffee Glass Animation</title>
</head>
<body>
   <div class="glass3d"></div>
    <div class="glass3d--bottom"></div>
    <div class="glass">
      <div class="lemon">
        <div class="gajo g1"></div>
        <div class="gajo g2"></div>
        <div class="gajo g3"></div>
        <div class="gajo g4"></div>
        <div class="gajo g5"></div>
        <div class="gajo g6"></div>
        <div class="gajo g7"></div>
        <div class="gajo g8"></div>
      </div>
      <div class="liquid">
        <div class="bubble b1"></div>
        <div class="bubble b2"></div>
        <div class="bubble b3"></div>
        <div class="bubble b4"></div>
      </div>
      <div class="ice ice1"></div>
      <div class="ice ice2"></div>
    </div>
</body>
</html>
