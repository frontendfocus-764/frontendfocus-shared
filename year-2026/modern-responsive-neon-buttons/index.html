<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <title>Modern Responsive Neon Buttons</title>
</head>
<body>
   <div class="button-collection">
        <button class="flux-button red">
            <span class="button-icon">✳</span>
            <span class="button-label">Explore</span>
            <span class="button-arrow">↗</span>
        </button>

        <button class="flux-button blue">
            <span class="button-icon">☼</span>
            <span class="button-label">Energy</span>
            <span class="button-arrow">↗</span>
        </button>

        <button class="flux-button purple">
            <span class="button-icon">✧</span>
            <span class="button-label">Create</span>
            <span class="button-arrow">↗</span>
        </button>

        <button class="flux-button green">
            <span class="button-icon">◈</span>
            <span class="button-label">Discover</span>
            <span class="button-arrow">↗</span>

        </button>
    </div>

    <script src="frontendfocus.js"></script>
</body>
</html>
