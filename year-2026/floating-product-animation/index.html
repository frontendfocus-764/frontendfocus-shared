<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <title>Floating Product Slider</title>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="./img/p-1.png" alt="">
            </div>
            <ul>
                <li>Home</li>
                <li>Flavor</li>
                <li>About</li>
            </ul>
            <div class="cta">
                Shop now
            </div>
        </header>
        <section>
            <div class="info">
                <h1>Orange Juice</h1>
                <p>Orange juice is a liquid extract of the orange tree fruit, produced by squeezing or reaming oranges.
                    It comes in several different varieties, including blood orange, navel oranges, valencia orange,
                    clementine, and tangerine.</p>
            </div>
            <ul class="flavors">
                <li data-num="1" class="flavor active"><img src="./img/p-2.png" alt=""></li>
                <li data-num="2" class="flavor"><img src="./img/p-3.png" alt=""></li>
                <li data-num="3" class="flavor"><img src="./img/p-4.png" alt=""></li>
                <li data-num="4" class="flavor"><img src="./img/p-5.png" alt=""></li>
            </ul>
        </section>
        <ul class="flavors-wheel">
            <li class="flavor"><img src="./img/p-6.png" alt=""></li>
            <li class="flavor"><img src="./img/p-7.png" alt=""></li>
            <li class="flavor"><img src="./img/p-8.png" alt=""></li>
            <li class="flavor"><img src="./img/p-9.png" alt=""></li>
        </ul>
        <ul class="juices-wheel">
            <li class="flavor"><img src="./img/p-2.png" alt=""></li>
            <li class="flavor"><img src="./img/p-3.png" alt=""></li>
            <li class="flavor"><img src="./img/p-4.png" alt=""></li>
            <li class="flavor"><img src="./img/p-5.png" alt=""></li>
        </ul>
    </div>

    <script src="frontendfocus.js"></script>
</body>
</html>
