<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <title>Pure CSS Space Colony Animation</title>
</head>
<body>
    <div class="moonscape" role="img" aria-label="A colony on an alien moon at dawn: a ringed gas giant fills the sky, a monorail train glides past a glowing biodome, and a rocket lifts off from the launch tower">
      <div class="nebula"></div>
      <div class="stars" data-stars="far"></div>
      <div class="stars" data-stars="near"></div>
      <div class="satellite"></div>
      <div class="meteor"></div>
      <div class="moon" data-moon="near"></div>
      <div class="moon" data-moon="far"></div>
      <div class="ring" data-ring="back"></div>
      <div class="planet"></div>
      <div class="ring" data-ring="front"></div>
      <div class="dawn"></div>
      <div class="ground" data-ground="mesa"></div>
      <div class="ground" data-ground="glow"></div>
      <div class="ground" data-ground="east-lit"></div>
      <div class="ground" data-ground="east-dark"></div>
      <div class="ground" data-ground="west-lit"></div>
      <div class="ground" data-ground="west-dark"></div>
      <div class="ground" data-ground="plain"></div>
      <div class="colony" data-part="dome"></div>
      <div class="colony" data-part="dome-ring"></div>
      <div class="colony" data-part="hab-west"></div>
      <div class="colony" data-part="hab-east"></div>
      <div class="colony" data-part="mast"></div>
      <div class="colony" data-part="dish"></div>
      <div class="colony" data-part="tower"></div>
      <div class="colony" data-part="arm"></div>
      <div class="rocket">
        <div class="plume"></div>
        <div class="rocket-part" data-part="fins"></div>
        <div class="rocket-part" data-part="body"></div>
        <div class="rocket-part" data-part="nose"></div>
        <div class="rocket-part" data-part="bell"></div>
      </div>
      <div class="colony" data-part="pad"></div>
      <div class="beacons"></div>
      <div class="exhaust"></div>
      <div class="monorail" data-rail="pylons"></div>
      <div class="monorail" data-rail="track"></div>
      <div class="train"></div>
      <div class="ground" data-ground="ridge-rim"></div>
      <div class="ground" data-ground="ridge"></div>
      <div class="shard" data-shard="glow"></div>
      <div class="shard" data-shard="west-lit"></div>
      <div class="shard" data-shard="west-dark"></div>
      <div class="shard" data-shard="east-lit"></div>
      <div class="shard" data-shard="east-dark"></div>
      <div class="spores" data-spores="a"></div>
      <div class="spores" data-spores="b"></div>
    </div>
    <script src="frontendfocus.js"></script>
</body>
</html>
