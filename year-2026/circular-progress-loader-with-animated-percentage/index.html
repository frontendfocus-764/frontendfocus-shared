<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <title>CSS Circular Progress Loader with Animated Percentage</title>
</head>
<body>
    <div class="main-container">
    <div class="loader-section">
      <div class="progress-ring" id="progressRing"></div>
      
      <div class="center-text">
        <div class="percentage" id="percentageText">0%</div>
        <div class="status" id="statusText">processing</div>
      </div>
    </div>

    <div class="bottom-text">
      <h2>Our AI is processing data</h2>
      <p>Sit tight and relax, the process<br>will take up to 30 seconds</p>
    </div>
  </div>

    <script src="frontendfocus.js"></script>
</body>
</html>
