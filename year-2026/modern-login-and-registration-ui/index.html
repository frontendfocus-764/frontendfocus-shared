<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <title>Responsive Sign Up and Login Form</title>
</head>
<body>
    <main>
      <input type="checkbox" aria-hidden="false" id="chk" />
      <!-- Sign-up -->
      <div class="sign-up">
        <form class="sign-up-form">
          <label for="chk">sign up</label>
          <input type="text" required placeholder="User Name" />
          <input type="email" required placeholder="Email" />
          <input type="tel" required placeholder="Phone No." />
          <input type="password" required placeholder="Password" />
          <button>sign up</button>
        </form>
      </div>
      <!-- login -->
      <div class="login">
        <form>
          <label for="chk">login</label>
          <input type="email" required placeholder="Email" />
          <input type="password" required placeholder="Password" />
          <button>login</button>
        </form>
      </div>
    </main>
</body>
</html>
