<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <title>Solar Eclipse | Pure CSS Animation</title>
</head>
<body>
   <main>
        <section class="eclipse-hero">
            <div class="eclipse-hero__sky" aria-hidden="true">
                <div class="eclipse-hero__stars"></div>
                <div class="eclipse-hero__stars eclipse-hero__stars--near"></div>

                <div class="eclipse-hero__system">
                    <div class="eclipse-hero__sun"></div>

                    <div class="eclipse-hero__moon-track">
                        <div class="eclipse-hero__corona"></div>
                        <div class="eclipse-hero__moon"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
