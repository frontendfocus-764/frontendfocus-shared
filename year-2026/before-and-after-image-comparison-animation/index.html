<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <title>Before & After Image Comparison Animation | HTML & CSS</title>
</head>
<body>
    <div id="app">
    <div>
        <h1 style="text-transform: uppercase; margin-bottom: 0;">Pure CSS <span>Image Comparison Gallery</span></h1>
    </div>
    <hr width="100%">

    <!-- Automatic Image Comparison -->
    <div>
        <h1>Automatic <span>Image Comparison</span></h1>
        <div class="diff-container diff_5">
            <div class="image-container image-first"></div>
            <div class="image-container image-second">
                <div class="image"></div>
                <div class="resizer"></div>
                <div class="image-container image-third">
                    <div class="image"></div>
                    <div class="resizer"></div>
                </div>
            </div>
        </div>
    </div>

    <hr width="100%">

    <!-- Multiple Image Comparison -->
    <div>
        <h1>Multiple <span>Image Comparison</span></h1>
        <div class="diff-container diff_4">
            <div class="image-container image-first">
                <div class="image"></div>
                <div class="resizer"></div>
            </div>
            <div class="image-container image-second">
                <div class="image"></div>
                <div class="resizer"></div>
            </div>
            <div class="image-container image-third">
                <div class="image"></div>
                <div class="resizer"></div>
            </div>
            <div class="image-container image-fourth">
                <div class="image"></div>
                <div class="resizer"></div>
            </div>
            <div class="image-container image-fifth">
            </div>
        </div>
    </div>

    <hr width="100%">

    <!-- Three Image Comparison -->
    <div>
        <h1>Three <span>Image Comparison</span></h1>
        <div class="diff-container diff_1">
            <div class="image-container image-first">
                <div class="image"></div>
                <div class="resizer"></div>
            </div>
            <div class="image-container image-second">
                <div class="image"></div>
                <div class="resizer"></div>
            </div>
            <div class="image-container image-third">
            </div>
        </div>
    </div>

    <hr width="100%">

    <!-- Classic Before & After -->
    <div>
        <h1>Classic <span>Before &amp; After</span></h1>
        <div class="diff-container diff_2">
            <div class="image-container image-first">
                <div class="image"></div>
                <div class="resizer"></div>
            </div>
            <div class="image-container image-second">
            </div>
        </div>
    </div>

    <hr width="100%">

    <!-- Window Comparison -->
    <div>
        <h1>Window <span>Comparison Effect</span></h1>
        <div class="diff-container diff_3">
            <div class="image-container image-second">
                <div class="image"></div>
                <div class="left_image"></div>
                <div class="window"></div>
                <div class="resizer"></div>
            </div>
            <div class="image-container image-third"></div>
        </div>
    </div>
</body>
</html>
