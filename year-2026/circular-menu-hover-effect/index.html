<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <title>Circular Select Menu Animation</title>
</head>

<body>
    <main id="app">
        <select class="select-2" tabindex="1" autofocus>
            <option>00 — Dashboard overview</option>
            <option>01 — User profile settings</option>
            <option>02 — Notifications center</option>
            <option>03 — Messages and inbox</option>
            <option>04 — Calendar events</option>
            <option>05 — Project roadmap</option>
            <option>06 — Current active item</option>
            <option>07 — Analytics reports</option>
            <option>08 — Billing and invoices</option>
            <option>09 — Team permissions</option>
            <!--            <option>10 — Integrations hub</option>-->
            <!--            <option>11 — Security options</option>-->
            <!--            <option>12 — Help and support</option>-->
        </select>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>
    <script src="frontendfocus.js"></script>
</body>

</html>
