<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <title>Split Counter Like Button</title>
</head>
<body>
    <div class="button-container">
    <input hidden="" id="checknumber" type="checkbox" />
    <label for="checknumber" class="button">
        <div id="leftpart">
        <p id="currentnumber">24</p>
        <p id="movenumber">25</p>
        </div>

        <div id="rightpart">
        <svg
            id="likeimg"
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="3"
            stroke="#00d5ff"
            fill="none"
            viewBox="0 0 24 24"
            height="24"
            width="24"
            xmlns="http://www.w3.org/2000/svg"
        >
            <path
            d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"
            ></path>
        </svg>
        <div id="fontlikebutton">Like</div>
        </div>
    </label>
    </div>
</body>
</html>
