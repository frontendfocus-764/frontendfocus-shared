<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <title>Premium Interactive Product Cards | HTML, CSS & JavaScript</title>
</head>
<body>
    <div class="products">

        <!-- PRODUCT 01 -->
        <article class="product-card card-green">

            <div class="back-layer"></div>

            <div class="card-inner">

                <div class="badges">
                    <span class="badge badge-new">New</span>
                    <span class="badge badge-sale">-10%</span>
                </div>

                <div class="product-actions">
                    <button aria-label="Quick view">
                        <i class="fa-regular fa-eye"></i>
                    </button>

                    <button aria-label="Add to wishlist">
                        <i class="fa-regular fa-heart"></i>
                    </button>

                    <button aria-label="Share product">
                        <i class="fa-solid fa-arrow-up-from-bracket"></i>
                    </button>
                </div>

                <div class="product-image">

                    <div class="product-glow"></div>

                    <img class="image image-main" src="./img/p-11.png"
                        alt="Wireless headphones">

                    <img class="image image-hover" src="./img/p-12.png"
                        alt="Wireless headphones alternate">

                </div>

                <div class="product-info">

                    <span class="category">Audio Collection</span>

                    <h2>Studio Wireless</h2>

                    <div class="rating">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star-half-stroke"></i>

                        <span>4.8</span>
                    </div>

                    <div class="price-row">
                        <span class="price">$179</span>
                        <span class="old-price">$199</span>
                    </div>

                    <button class="add-cart">
                        <span>Add to cart</span>

                        <span class="cart-icon">
                            <i class="fa-solid fa-bag-shopping"></i>
                        </span>
                    </button>

                </div>

            </div>
        </article>

        <!-- PRODUCT 02 -->
        <article class="product-card card-orange">

            <div class="back-layer"></div>

            <div class="card-inner">

                <div class="badges">
                    <span class="badge badge-sale">-10%</span>
                </div>

                <div class="product-actions">
                    <button aria-label="Quick view">
                        <i class="fa-regular fa-eye"></i>
                    </button>

                    <button aria-label="Add to wishlist">
                        <i class="fa-regular fa-heart"></i>
                    </button>

                    <button aria-label="Share product">
                        <i class="fa-solid fa-arrow-up-from-bracket"></i>
                    </button>
                </div>

                <div class="product-image">

                    <div class="product-glow"></div>

                    <img class="image image-main" src="./img/p-13.png"
                        alt="Luxury perfume">

                    <img class="image image-hover" src="./img/p-14.png"
                        alt="Luxury perfume alternate">

                </div>

                <div class="product-info">

                    <span class="category">Signature Series</span>

                    <h2>Maison Essence</h2>

                    <div class="rating">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-regular fa-star"></i>

                        <span>4.6</span>
                    </div>

                    <div class="price-row">
                        <span class="price">$89</span>
                        <span class="old-price">$99</span>
                    </div>

                    <button class="add-cart">
                        <span>Add to cart</span>

                        <span class="cart-icon">
                            <i class="fa-solid fa-bag-shopping"></i>
                        </span>
                    </button>

                </div>

            </div>
        </article>

        <!-- PRODUCT 03 -->
        <article class="product-card card-blue">

            <div class="back-layer"></div>

            <div class="card-inner">

                <div class="badges">
                    <span class="badge badge-new">New</span>
                </div>

                <div class="product-actions">
                    <button aria-label="Quick view">
                        <i class="fa-regular fa-eye"></i>
                    </button>

                    <button aria-label="Add to wishlist">
                        <i class="fa-regular fa-heart"></i>
                    </button>

                    <button aria-label="Share product">
                        <i class="fa-solid fa-arrow-up-from-bracket"></i>
                    </button>
                </div>

                <div class="product-image">

                    <div class="product-glow"></div>

                    <img class="image image-main"
                        src="./img/p-15.png" alt="Running sneakers">

                    <img class="image image-hover shoe-alt"
                        src="./img/p-16.png"
                        alt="Running sneakers alternate">

                </div>

                <div class="product-info">

                    <span class="category">Performance</span>

                    <h2>Velocity Runner</h2>

                    <div class="rating">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star-half-stroke"></i>

                        <span>4.9</span>
                    </div>

                    <div class="price-row">
                        <span class="price">$129</span>
                        <span class="old-price">$149</span>
                    </div>

                    <button class="add-cart">
                        <span>Add to cart</span>

                        <span class="cart-icon">
                            <i class="fa-solid fa-bag-shopping"></i>
                        </span>
                    </button>

                </div>

            </div>
        </article>

    </div>

    <script src="frontendfocus.js"></script>
</body>
</html>
