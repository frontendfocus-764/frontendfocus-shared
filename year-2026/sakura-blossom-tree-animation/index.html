               The limbs are not: they bend, and a bent limb wanders off a
               gradient's axis and washes out. So the limbs are painted flat and
               lit by the second group below, a slimmer ribbon built from the
               same centre line, which follows every curve exactly. -->

            <stop class="k0" offset="0"/>

            <stop class="k2" offset=".56"/>

          <!-- bark grain, and the light down the trunk -->
          <pattern id="grain" width=".9" height="4" patternUnits="userSpaceOnUse"
                   patternTransform="rotate(4)">
            <rect width=".16" height="4" fill="#000"/>
          </pattern>
          <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
            <stop class="lit" offset="0"/>
            <stop class="unlit" offset=".84"/>
          </linearGradient>
          <filter id="soften" x="-60%" y="-20%" width="220%" height="140%">
            <feGaussianBlur stdDeviation=".38"/>

          <filter id="smudge" x="-8%" y="-8%" width="116%" height="116%">
            <feGaussianBlur stdDeviation=".1"/>
          </filter>

            <stop class="fork-tone" offset="1" stop-opacity="0"/>
          </linearGradient>

            <stop offset="0" stop-color="white"/>
            <stop offset="1" stop-color="black"/>
          </linearGradient>

            <rect width="100" height="44" fill="url(#flank-fade)"/>
