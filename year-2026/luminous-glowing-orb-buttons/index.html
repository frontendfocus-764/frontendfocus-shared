<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <title>Luminous Glowing Orb Buttons with Micro-interactions</title>
</head>
<body>
    <div class="button-stack">
    <div class="btn-wrapper">
        <button class="orb-btn btn-teal" aria-label="Add">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <line x1="12" y1="4" x2="12" y2="20"></line>
            <line x1="4" y1="12" x2="20" y2="12"></line>
        </svg>
        </button>
        <span class="btn-label">Create</span>
    </div>

    <div class="btn-wrapper">
        <button class="orb-btn btn-silver" aria-label="Open or Export">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 17 L17 7 M17 7 L9 7 M17 7 L17 15"></path>
        </svg>
        </button>
        <span class="btn-label">Export</span>
    </div>

    <div class="btn-wrapper">
        <button class="orb-btn btn-mauve" aria-label="Confirm">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 13 L10 17.5 L19 7"></path>
        </svg>
        </button>
        <span class="btn-label">Confirm</span>
    </div>
    </div>
</body>
</html>
