<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <title>Interactive and Draggable Text OpenAI</title>
</head>
<body>
    <div class="demo">
    <div
        class="tech-text"
        id="tech-text"
        role="img"
        aria-label="KAM.SOFTWARE"
        data-text="OpenAI"
        data-font-family=""
        data-font-weight="600"
        data-font-size="150"
        data-letter-spacing="-0.05"
        data-color="#ffffff"
        data-accent-color="#ffffff"
        data-reach="200"
        data-softness="0.7"
        data-dash-length="4"
        data-dash-gap="2"
        data-stroke-width="1.5"
        data-line-style="dashed"
        data-reveal="letter"
        data-specks="15"
        data-selection="true"
        data-labels="true"
        data-draggable="true"
        data-sweep="true"
        data-speed="1"
    >
        <canvas class="tech-text__canvas" data-canvas></canvas>
    </div>
    </div>
    <script src="frontendfocus.js"></script>
</body>
</html>
