<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <title>Skeuomorphic Bouncing Toggle Switch Button</title>
</head>
<body>
    <div class="toggle" id="toggle">
        <div class="track" id="track"></div>
    </div>

    <div class="ball-shadow" id="ballShadow"></div>

    <div class="knob" id="knob">
        <div class="knob-body" id="knobBody"></div>
    </div>
    <script src="frontendfocus.js"></script>
</body>
</html>
