<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <title>Watermelon Preloader Animation | HTML & CSS</title>
</head>
<body>
    <svg class="melon" viewBox="0 0 100 100" width="100" height="100">
			<g fill="none" stroke-linecap="round" transform="translate(50, 50)">
				<circle class="melon__core" r="13" stroke="hsl(0, 100%, 70%)" stroke-width="26" pathLength="1" stroke-dasharray="1 1" />
				<g class="melon__seeds" fill="hsl(0, 0%, 10%)">
					<g transform="rotate(0)">
						<ellipse class="melon__seed" rx="4" ry="5" transform="scale(0)" />
					</g>
					<g transform="rotate(60)">
						<ellipse class="melon__seed" rx="4" ry="5" transform="scale(0)" />
					</g>
					<g transform="rotate(120)">
						<ellipse class="melon__seed" rx="4" ry="5" transform="scale(0)" />
					</g>
					<g transform="rotate(180)">
						<ellipse class="melon__seed" rx="4" ry="5" transform="scale(0)" />
					</g>
					<g transform="rotate(240)">
						<ellipse class="melon__seed" rx="4" ry="5" transform="scale(0)" />
					</g>
					<g transform="rotate(300)">
						<ellipse class="melon__seed" rx="4" ry="5" transform="scale(0)" />
					</g>
				</g>
				<g stroke="hsl(130, 100%, 25%)" stroke-width="5" stroke-dasharray="1 1">
					<circle class="melon__skin" r="35" pathLength="1" />
					<g transform="rotate(180)">
						<circle class="melon__skin" r="35" pathLength="1"  />
					</g>
				</g>
				<g stroke="hsl(223, 10%, 50%)" stroke-width="3" stroke-dasharray="0.3 1.7" opacity="0.5">
					<circle class="melon__motion" r="48" pathLength="1" />
					<g transform="rotate(180)">
						<circle class="melon__motion" r="48" pathLength="1" />
					</g>
				</g>
			</g>
		</svg>
</body>
</html>
