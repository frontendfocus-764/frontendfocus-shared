<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <title>Pure CSS Cooking Pot Animation | HTML & CSS</title>
</head>
<body>
    <button class="cook" type="button">Cook it again</button>
    <figure
    class="scene"
    role="img"
    aria-label="CAT. 006 - THE POT. A dark enamel pot of borscht under one warm lamp: deep bordeaux broth with beet, potato and cabbage, a swirl of smetana, scattered dill, and steam rising through the light."
    >
    <div class="shadow"></div>
    <div class="handle handle-left"></div>
    <div class="handle handle-right"></div>
    <div class="pot-body"></div>
    <div class="inner-wall"></div>
    <div class="broth"></div>
    <div class="bubble bubble-a"></div>
    <div class="bubble bubble-b"></div>
    <div class="bubble bubble-c"></div>
    <div class="bubble bubble-d"></div>
    <div class="bubble bubble-rest-a"></div>
    <div class="bubble bubble-rest-b"></div>
    <div class="bubble bubble-rest-c"></div>
    <div class="beet-baton beet-a"></div>
    <div class="beet-baton beet-b"></div>
    <div class="beet-baton beet-c"></div>
    <div class="cabbage cabbage-a"></div>
    <div class="cabbage cabbage-b"></div>
    <div class="cabbage cabbage-c"></div>
    <div class="smetana"></div>
    <div class="dill-pinch-a"></div>
    <div class="dill-pinch-b"></div>
    <div class="rim"></div>
    <div class="beet-drop"></div>
    <div class="beet-drop-b"></div>
    <div class="beet-drop-c"></div>
    <div class="potato potato-a"></div>
    <div class="potato potato-b"></div>
    <div class="ring"></div>
    <div class="droplets"></div>
    <div class="steam steam-a"></div>
    <div class="steam steam-b"></div>
    <div class="steam steam-c"></div>
    </figure>
</body>
</html>
