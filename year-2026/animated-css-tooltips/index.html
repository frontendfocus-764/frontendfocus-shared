
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="frontendfocus.css">
  <title>Animated CSS Tooltips</title>
</head>
<body>
  <main class="tooltip-showcase">

    <section class="tooltip-card">
      <h2><span class="number">01</span> Fade</h2>
      <p class="card-description">Smooth and subtle appearance</p>
      <ul>
        <li class="tooltip fade" data-title="Hypertext Markup Language">HTML</li>
        <li class="tooltip fade" data-title="Cascading Style Sheets">CSS</li>
        <li class="tooltip fade" data-title="JavaScript">JS</li>
      </ul>
    </section>

    <section class="tooltip-card">
      <h2><span class="number">02</span> Expand</h2>
      <p class="card-description">A soft zoom-in effect</p>
      <ul>
        <li class="tooltip expand" data-title="Hypertext Markup Language">HTML</li>
        <li class="tooltip expand" data-title="Cascading Style Sheets">CSS</li>
        <li class="tooltip expand" data-title="JavaScript">JS</li>
      </ul>
    </section>

    <section class="tooltip-card">
      <h2><span class="number">03</span> Swing</h2>
      <p class="card-description">A playful motion effect</p>
      <ul>
        <li class="tooltip swing" data-title="Hypertext Markup Language">HTML</li>
        <li class="tooltip swing" data-title="Cascading Style Sheets">CSS</li>
        <li class="tooltip swing" data-title="JavaScript">JS</li>
      </ul>
    </section>
  </main>
</body>
</html>
