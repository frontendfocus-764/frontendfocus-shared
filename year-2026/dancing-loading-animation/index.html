<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <title>Dancing Loading Animation with CSS 🔥 | Creative CSS Loader</title>
</head>
<body>
    <div class="stage">
    <div class="orb" role="status" aria-label="Loading">
      <a class="hit" href="#" rel="noopener" tabindex="-1" aria-hidden="true"></a>
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="48"/>
        <circle class="arc" cx="50" cy="50" r="48"/>
      </svg>
      <div class="window">
        <canvas id="dancer" aria-hidden="true"></canvas>
      </div>
    </div>
  </div>

    <script src="frontendfocus.js"></script>
</body>
</html>
