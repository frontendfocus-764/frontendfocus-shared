<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <title>Interactive Animated Branched Menu</title>
</head>
<body>
    <div class="demo-wrap">
    <nav id="branchedMenu" class="branched-menu">
      <span class="branched-marker" data-marker></span>
      
      <!-- Section 0 -->
      <div class="section" data-section="0">
        <button class="section-head" data-head="0">Getting started</button>
        <div class="section-body">
          <div class="section-body-inner">
            <div class="section-content">
              <svg class="branches" width="40" height="156" viewBox="0 0 40 156" aria-hidden="true">
                <path class="branch-line" d="M 14 0 V 122" />
                <path class="branch-line" d="M 14 14 A 10 10 0 0 0 24 24 H 32" />
                <path class="branch-line" d="M 14 50 A 10 10 0 0 0 24 60 H 32" />
                <path class="branch-line" d="M 14 86 A 10 10 0 0 0 24 96 H 32" />
                <path class="branch-line" d="M 14 122 A 10 10 0 0 0 24 132 H 32" />
                <path class="branch-reach" data-reach="install" d="M 14 0 V 14 A 10 10 0 0 0 24 24 H 32" style="stroke-dasharray: 37.708; stroke-dashoffset: 0;" />
                <path class="branch-reach" data-reach="quick" d="M 14 0 V 50 A 10 10 0 0 0 24 60 H 32" style="stroke-dasharray: 73.708; stroke-dashoffset: 73.708;" />
                <path class="branch-reach" data-reach="config" d="M 14 0 V 86 A 10 10 0 0 0 24 96 H 32" style="stroke-dasharray: 109.708; stroke-dashoffset: 109.708;" />
                <path class="branch-reach" data-reach="theming" d="M 14 0 V 122 A 10 10 0 0 0 24 132 H 32" style="stroke-dasharray: 145.708; stroke-dashoffset: 145.708;" />
              </svg>
              <button class="child" data-value="install" data-active>
                <span class="child-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 19h16"/></svg>
                </span>
                <span class="child-label">Installation</span>
              </button>
              <button class="child" data-value="quick">
                <span class="child-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
                </span>
                <span class="child-label">Quick start</span>
              </button>
              <button class="child" data-value="config">
                <span class="child-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </span>
                <span class="child-label">Configuration</span>
              </button>
              <button class="child" data-value="theming">
                <span class="child-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.06 11.9l8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/></svg>
                </span>
                <span class="child-label">Theming</span>
              </button>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Section 1 -->
      <div class="section" data-section="1">
        <button class="section-head" data-head="1">Components</button>
        <div class="section-body">
          <div class="section-body-inner">
            <div class="section-content">
              <svg class="branches" width="40" height="156" viewBox="0 0 40 156" aria-hidden="true">
                <path class="branch-line" d="M 14 0 V 122" />
                <path class="branch-line" d="M 14 14 A 10 10 0 0 0 24 24 H 32" />
                <path class="branch-line" d="M 14 50 A 10 10 0 0 0 24 60 H 32" />
                <path class="branch-line" d="M 14 86 A 10 10 0 0 0 24 96 H 32" />
                <path class="branch-line" d="M 14 122 A 10 10 0 0 0 24 132 H 32" />
                <path class="branch-reach" data-reach="buttons" d="M 14 0 V 14 A 10 10 0 0 0 24 24 H 32" style="stroke-dasharray: 37.708; stroke-dashoffset: 37.708;" />
                <path class="branch-reach" data-reach="typography" d="M 14 0 V 50 A 10 10 0 0 0 24 60 H 32" style="stroke-dasharray: 73.708; stroke-dashoffset: 73.708;" />
                <path class="branch-reach" data-reach="overlays" d="M 14 0 V 86 A 10 10 0 0 0 24 96 H 32" style="stroke-dasharray: 109.708; stroke-dashoffset: 109.708;" />
                <path class="branch-reach" data-reach="toasts" d="M 14 0 V 122 A 10 10 0 0 0 24 132 H 32" style="stroke-dasharray: 145.708; stroke-dashoffset: 145.708;" />
              </svg>
              <button class="child" data-value="buttons">
                <span class="child-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
                </span>
                <span class="child-label">Buttons</span>
              </button>
              <button class="child" data-value="typography">
                <span class="child-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
                </span>
                <span class="child-label">Typography</span>
              </button>
              <button class="child" data-value="overlays">
                <span class="child-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
                </span>
                <span class="child-label">Overlays</span>
              </button>
              <button class="child" data-value="toasts">
                <span class="child-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                </span>
                <span class="child-label">Toasts</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </nav>
  </div>
    <script src="frontendfocus.js"></script>
</body>
</html>
