<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Add To Cart Button With Quantity Select Option</title>
</head>
<body>
    <div class="cont">
        <div class="crtdiv">
            <span class="qty">
                <span class="dec">
                    <i class="fa fa-minus-square" aria-hidden="true"></i>
                </span>
                <span class="num">
                    1
                </span>
                <span class="inc">
                    <i class="fa fa-plus-square" aria-hidden="true"></i>
                </span>
            </span>
            <button id="btn" type="button" class="cart"><i class="fa fa-shopping-cart" aria-hidden="true"></i> Add to cart</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script type="module" src="frontendfocus.js"></script>
</body>
</html>
