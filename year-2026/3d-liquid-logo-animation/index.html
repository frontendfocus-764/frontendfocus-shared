<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <title>3D Liquid Logo Animation</title>
</head>
<body>
    <section class="hero">
      <div class="depth-layer">
        <div class="depth-mask"></div>
      </div>
      <div class="depth-layer">
        <div class="depth-mask"></div>
      </div>
      <div class="depth-layer">
        <div class="depth-mask"></div>
      </div>
      <div class="depth-layer">
        <div class="depth-mask"></div>
      </div>
      <div class="depth-layer">
        <div class="depth-mask"></div>
      </div>
      <div class="depth-layer">
        <div class="logo">
          <img src="logo.webp" alt="Logo" />
        </div>
      </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="frontendfocus.js"></script>
</body>
</html>
