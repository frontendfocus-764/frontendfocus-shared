<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <title>Infinite Auto-Scrolling Papyrus Scroll Animation | HTML, CSS & JavaScript</title>
</head>
<body>
    <div class="stage">
        <div class="rod rod-top"></div>

        <div class="scroll-body">
            <div class="frame"><span class="c2"></span><span class="c3"></span></div>
            <div class="viewport">
                <div class="track" id="track"></div>
            </div>
            <div class="glow"></div>
        </div>

        <div class="rod rod-bottom"></div>
        <div class="caption">◆ scroll of endless verse ◆ hover to pause ◆</div>
    </div>
    <script src="frontendfocus.js"></script>
</body>
</html>
