<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontendfocus.css">
    <title>Animated Toast Notification UI using HTML, CSS & JavaScript</title>
</head>
<body>
    <div class="buttons-container">
        <button class="error-btn" onclick="addNotification('error')">Error</button>
        <button class="warning-btn" onclick="addNotification('warning')">Warning</button>
        <button class="success-btn" onclick="addNotification('success')">Success</button>
    </div>
    <div class="notification-stack-wrapper" id="notificationStack"></div>
    
    <script src="frontendfocus.js"></script>
</body>
</html>
